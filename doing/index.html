<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Doing</title>
<meta name="theme-color" content="#1E5A96">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Doing">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1E5A96;--blue2:#2B6FB3;--accent:#D9822B;--ok:#2E8B57;--warn:#C0392B;
  --bg:#F3F5F9;--card:#FFFFFF;--line:#D8DFE8;--ink:#1C2430;--muted:#66717F;--soft:#E8EEF6;--muted2:#4A5563;--latebg:#FFF7EE;--lateline:#F0C9A0;--okbg:#E6F4EC;--okline:#9FD3B4;
  --fs:17px;--pad-b:env(safe-area-inset-bottom,0px);--pad-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121820;--card:#1B2430;--line:#2C3847;--ink:#E7ECF2;--muted:#9AA7B6;--soft:#233040;--blue:#7FB0E6;--blue2:#5E93CC;--muted2:#B5C0CC;--latebg:#2A2218;--lateline:#6B4A22;--okbg:#17302A;--okline:#2E6B4F}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Segoe UI",Arial,sans-serif;font-size:var(--fs);line-height:1.45;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2)}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,#1E5A96,#2B6FB3);color:#fff;padding:calc(10px + var(--pad-t)) 14px 10px}
.top h1{margin:0;font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.top h1 small{font-weight:400;font-size:13px;opacity:.9}
.quick{margin-top:10px;display:flex;gap:6px}
.quick input{flex:1;font-size:17px;padding:11px 12px;border:0;border-radius:12px;background:rgba(255,255,255,.96);color:#1C2430}
.quick button{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;min-width:46px;font-size:20px}
.rec,.quick button.rec{background:#C0392B;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.hint{font-size:12.5px;opacity:.9;margin-top:6px;min-height:16px}
.hint:empty{display:none}
.status{display:block;width:100%;text-align:right;font-size:12.5px;opacity:.9;margin-top:4px;padding:0;color:#fff;min-height:16px}
.status.warn{opacity:1;font-weight:600;color:#FFD9B0}
.mrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;min-height:52px;text-align:right;box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--ink)}
.mrow:active{background:var(--soft)}
.mrow .mic{font-size:22px;width:32px;text-align:center;flex:none}
.mrow .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .mt b{font-size:16px;font-weight:600}
.mrow .mt small{font-size:13.5px;color:var(--muted);line-height:1.3}
.mrow .chev{color:var(--muted);font-size:20px;flex:none}
.mrow.big{min-height:64px;padding:10px 12px}
.mrow.big .mic{font-size:26px;width:36px}
.mrow.big .mt b{font-size:17px}
#v-more h2.msec{font-size:15px;margin:14px 2px 4px}
.card.sum{display:block;background:var(--soft);border-color:transparent}
.card.sum .m{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.card.stat{display:block}
.card.stat.ok{background:var(--okbg);border-color:var(--okline)}
.card.stat.pend{background:#FFF9E8;border-color:#F0DCA0}
.card.stat.warn{background:#FBE3DF;border-color:#F0B0A6}
@media (prefers-color-scheme:dark){.card.stat.pend{background:#2E2910;border-color:#6B5A22}.card.stat.warn{background:#3A1F1C;border-color:#7A3A33}}
.card.stat .n{font-size:16px}
.card.stat .m{font-size:14.5px;color:var(--muted2);margin-top:3px}
a.btn{text-decoration:none}
.setbody{padding:4px 10px 10px}
.setbody .lbl{font-size:15px;font-weight:600;margin:10px 0 2px}
.ex{font-size:13.5px;color:var(--muted);line-height:1.35;margin-bottom:6px}
.setbody input,.setbody textarea{font-size:16px}
details.grp.sub.set>summary{min-height:56px}
main{flex:1;padding:10px 12px calc(84px + var(--pad-b));max-width:760px;width:100%;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:var(--blue);margin:16px 2px 6px;padding-bottom:3px;border-bottom:2px solid var(--line)}
h2 .cnt{font-size:12px;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:7px 0;display:flex;align-items:flex-start;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card .t{flex:1;min-width:0}
.card .n{font-weight:600;font-size:17px;word-break:break-word}
.card .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.card.stuck{border-color:var(--accent)}
.card.ev{background:var(--soft)}
.circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--blue2);flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.circle.done{background:var(--ok);border-color:var(--ok)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;margin-inline-start:5px;vertical-align:middle;background:var(--soft);color:var(--blue)}
.badge.warn{background:#FBE3DF;color:var(--warn)}
.badge.acc{background:#FBEBDD;color:#9B5A14}
.x{color:var(--muted);font-size:20px;padding:2px 6px;flex:none}
.zz{color:var(--muted);font-size:17px;padding:2px 4px;flex:none}
.search{margin-top:8px;display:none;gap:6px}.search.on{display:flex}
.search input{flex:1;font-size:16px;padding:9px 12px;border:0;border-radius:12px;background:rgba(255,255,255,.96);color:#1C2430}
.search button{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;min-width:42px;font-size:17px}
mark{background:#FFE9A8;color:inherit;border-radius:3px}
.q{border-color:var(--accent);background:var(--card)}
.q .n{color:var(--ink)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--soft);color:var(--blue);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.btn.p{background:var(--blue);color:#fff}
.btn.d{background:#FBE3DF;color:var(--warn)}
.btn.o{background:#E4F3EA;color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:16px}
.empty b{display:block;font-size:38px;margin-bottom:6px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--pad-b)}
.nav button{flex:1;padding:8px 0 6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button span{font-size:21px}
.nav button.on{color:var(--blue);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--pad-b));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .2s}
.sheet.on{transform:none}
.sheet h3{margin:0 0 10px;font-size:18px;color:var(--blue)}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}
.row>*{flex:1}
.row label,.lbl{font-size:13px;color:var(--muted);margin-bottom:2px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.chips button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.check{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.check input[type=checkbox]{width:22px;height:22px;flex:none}
.check input[type=text]{border:0;padding:4px;background:transparent}
.check.big{padding:12px 4px;font-size:19px;gap:14px;cursor:pointer}
.check.big input[type=checkbox]{width:28px;height:28px}
.check.big.done span{text-decoration:line-through;color:var(--muted)}
.check.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.thumb{max-width:100%;border-radius:10px;margin-top:6px}
.sec-toggle{width:100%;text-align:right;padding:8px 2px;color:var(--muted);font-size:14px}
details summary{cursor:pointer;color:var(--blue);font-weight:600;padding:6px 2px}
.toast{position:fixed;bottom:calc(70px + var(--pad-b));left:50%;transform:translateX(-50%);background:#1C2430;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:14px}
.toast.on{pointer-events:auto}
.toast button{color:#FFD166;font-weight:700;font-size:15px;padding:4px 6px;background:none;border:0}
.toast.on{opacity:1}
/* ===== 0.25: Today screen — new card, collapsible groups, floating menu (scoped to #v-today) ===== */
.nc .card{padding:8px 8px 8px 10px;margin:6px 0;position:relative;overflow:hidden;transition:background .25s,border-color .25s,transform .3s,opacity .3s,max-height .3s}
.nc .card::before{content:"";position:absolute;top:0;bottom:0;right:0;width:4px;background:transparent}
.nc .card.stuck{border-color:var(--line)}
.nc .card.stuck::before{background:var(--warn)}
.nc .card.late{background:var(--latebg);border-color:var(--lateline)}
.nc .card.late::before{background:var(--accent)}
.nc .card.ev::before{background:var(--blue2)}
.nc .card.pend{background:var(--okbg);border-color:var(--okline)}
.nc .card.pend::before{background:var(--ok)}
.nc .card.leaving{opacity:0;transform:translateX(-30px);max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0}
.nc .circle{width:40px;height:40px;border-width:2.5px;font-size:20px;margin-top:1px;background:var(--card);transition:background .2s,border-color .2s,transform .15s}
.nc .circle:active{transform:scale(.92)}
.nc .card.late .circle{border-color:var(--accent)}
.nc .card.pend .circle{background:var(--ok);border-color:var(--ok)}
.nc .card .n{line-height:1.3;max-height:2.6em;overflow:hidden}
.nc .card.pend .n{text-decoration:line-through;color:var(--muted)}
.nc .card .m{font-size:14.5px;color:var(--muted2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.nc .m .pill{background:var(--soft);color:var(--blue);border-radius:999px;padding:0 9px;font-weight:600;font-size:13.5px;line-height:22px}
.nc .m .st{font-weight:600}
.nc .m .st.late{color:#9B5A14}
.nc .m .st.stuck{color:var(--warn)}
.nc .m .note{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.nc .btns{margin-top:6px}
.nc .btns .btn{min-height:40px;display:inline-flex;align-items:center}
.more{width:36px;height:40px;flex:none;border-radius:10px;color:var(--muted);font-size:22px;display:flex;align-items:center;justify-content:center;line-height:1}
.more:active,.more.on{background:var(--soft);color:var(--blue)}
.donebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--ok);font-weight:600;font-size:15px}
.donebar .undo{background:var(--card);color:var(--ok);border:1.5px solid var(--okline);border-radius:10px;padding:0 14px;min-height:38px;font-weight:700}
.fu{color:var(--muted2);font-weight:400;font-size:13.5px;text-decoration:underline;padding:4px 0}
.prog{position:absolute;bottom:0;left:0;height:3px;background:var(--ok);width:100%;transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.nc .card.mini{padding:8px 10px}
.nc .card.mini .circle{width:30px;height:30px;font-size:15px}
.nc .card.mini .n{font-size:15px;max-height:1.3em}
details.grp{margin-top:6px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:6px 4px 4px;color:var(--blue);font-weight:700;font-size:15.5px;border-bottom:2px solid var(--line);margin-bottom:4px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .cnt{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:8px}
details.grp>summary::after{content:"‹";font-size:22px;color:var(--muted);transition:transform .2s;margin-inline-start:8px}
details.grp[open]>summary::after{transform:rotate(-90deg)}
details.grp.sub>summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
details.grp.done>summary{color:var(--ok)}
details.grp.list>summary{padding-left:4px}
details.grp.list>summary>span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.grp.list>summary .more{margin-inline-start:auto;margin-inline-end:2px}
details.grp.list .empty{padding:14px}
details.grp.list .empty b{font-size:24px}
.nc .card.log .n{text-decoration:none;color:var(--ink)}
.nc .card.log .circle{pointer-events:none}
.nc .card.log.closed{background:var(--soft);border-color:var(--line)}
.nc .card.log.closed::before{background:var(--muted)}
.nc .card.log.closed .circle{background:var(--muted);border-color:var(--muted)}
.nc .card.log .m .st.ok{color:var(--ok)}
.nc .card.log .m .st.closed{color:var(--muted)}
.pop{position:fixed;z-index:35;background:var(--card);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);border:1px solid var(--line);min-width:220px;padding:4px;display:none}
.pop.on{display:block}
.pop button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border-radius:10px;font-size:16px;text-align:right}
.pop button:active{background:var(--soft)}
.pop button .ic{width:26px;text-align:center;font-size:19px}
.pop button+button{border-top:1px solid var(--line);border-radius:0}
.pop button.danger{color:var(--warn)}
.pop::before{content:"";position:absolute;top:-7px;left:14px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.pop.up::before{top:auto;bottom:-7px;transform:rotate(225deg)}
.scrim{position:fixed;inset:0;z-index:34;display:none}
.scrim.on{display:block}

.small{font-size:13px;color:var(--muted)}
.src{font-size:14px;margin-inline-start:4px}
.listhead{display:flex;align-items:center;gap:8px}
.listhead .bell{font-size:18px;padding:2px 6px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.dt{position:relative;display:block;flex:1;min-width:0}.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;z-index:2}.dt .dtv{display:block;font-size:16px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.96);color:#1C2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dt .dtv.ph{color:#8A94A6}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span>My Doing</span><span style="display:flex;align-items:center;gap:10px"><small id="dateLine"></small><button id="exitBtn" title="יציאה" style="font-size:14px;font-weight:600;background:rgba(255,255,255,.2);border-radius:10px;padding:4px 10px">יציאה ⏻</button></span></h1>
    <div class="quick">
      <input id="quick" placeholder="הוספה מהירה…" autocomplete="off" enterkeyhint="done">
      <button id="micBtn" title="הקלטה קולית">🎤</button>
      <button id="searchBtn" title="חיפוש">🔍</button>
      <button id="addBtn" title="הוסף">＋</button>
    </div>
    <div class="hint" id="hint"></div>
    <button class="status" id="statusLine" title="מצב שמירה וסנכרון"></button>
    <div class="search" id="searchRow"><input id="search" placeholder="חיפוש בכל המשימות, הרשימות והיומן…" autocomplete="off" enterkeyhint="search"><button id="searchClear" title="סגור">✕</button></div>
  </header>

  <main>
    <section id="v-today" class="view on nc"></section>
    <section id="v-lists" class="view nc"></section>
    <section id="v-log" class="view nc"></section>
    <section id="v-more" class="view"></section>
    <section id="v-search" class="view"></section>
  </main>

  <nav class="nav">
    <button data-v="today" class="on"><span>☀️</span>היום</button>
    <button data-v="lists"><span>📋</span>רשימות</button>
    <button data-v="log"><span>📖</span>יומן</button>
    <button data-v="more"><span>⚙️</span>עוד</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div id="scrim" class="scrim"></div><div id="pop" class="pop"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== DB ===================== */
const DBN='mydoing', DBV=1;
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,DBV);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('items')){const s=d.createObjectStore('items',{keyPath:'id'});s.createIndex('status','status');}
    if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'});};
  r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=e=>rej(e);});}
const DB={
  all:()=>new Promise((res,rej)=>{const r=db.transaction('items').objectStore('items').getAll();r.onsuccess=()=>res(r.result);r.onerror=rej;}),
  put:it=>tx('items','readwrite',s=>s.put(it)),
  del:id=>tx('items','readwrite',s=>s.delete(id)),
  kget:k=>new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result?r.result.v:undefined);r.onerror=rej;}),
  kset:(k,v)=>tx('kv','readwrite',s=>s.put({k,v})),
};
/* ===================== Helpers ===================== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>new Date(s+'T00:00:00').getDay(); // 0=Sun..6=Sat
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function fmtDate(s){if(!s)return '';const t=today();if(s===t)return 'היום';if(s===addDays(t,1))return 'מחר';if(s===addDays(t,-1))return 'אתמול';const d=new Date(s+'T00:00:00');return 'יום '+DAYS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'.'+d.getFullYear():'');}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.addEventListener('error',e=>{try{logErr('JS: '+(e.message||e));}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{logErr('Promise: '+(e.reason&&(e.reason.message||e.reason)));}catch(_){}});
function logErr(m){const L=JSON.parse(localStorage.getItem('errlog')||'[]');L.unshift(new Date().toLocaleTimeString('he-IL')+' '+m);localStorage.setItem('errlog',JSON.stringify(L.slice(0,20)));toast('שגיאה: '+m);}

    else if(it.status==='open'&&(prev.status==='done'||prev.status==='closed'))type='reopened';else if(it.status==='open'&&prev.status==='trash')type='restored';}

/* ===================== Hebrew parsing ===================== */
const NUMW={'אחד':1,'אחת':1,'יומיים':2,'שניים':2,'שתיים':2,'שני':2,'שלושה':3,'שלוש':3,'ארבעה':4,'ארבע':4,'חמישה':5,'חמש':5,'שישה':6,'שש':6,'שבעה':7,'שבע':7,'שמונה':8,'תשעה':9,'תשע':9,'עשרה':10,'עשר':10};
const DAYN={'ראשון':0,'שני':1,'שלישי':2,'רביעי':3,'חמישי':4,'שישי':5,'שבת':6};
function nextDow(d,from){let s=from||today();for(let i=1;i<=7;i++){const c=addDays(s,i);if(dow(c)===d)return c;}return s;}
function parseHebrew(text){
  let t=' '+text.trim().replace(/\s+/g,' ')+' ';
  const r={title:'',date:null,time:null,condition:'',repeat:null,topic:false,window:null,list:null};
  const T=today();
  const cut=(re)=>{const m=t.match(re);if(m){t=t.replace(re,' ');return m;}return null;};
  // topic reminder
  let m=cut(/ תזכיר(?:י)? לי (?:על|לגבי|בקשר ל) /);if(m)r.topic=true;
  // condition
  m=t.match(/[,،]?\s*(אם |במידה ש|במקרה ש)(.+?)(?=[,،]| אז |$)/);if(m){r.condition=(m[1]+m[2]).trim();t=t.replace(m[0],' ');}
  // repeat
  m=cut(/ כל (\d+|[א-ת]+) (ימים|יום|שבועות|שבוע|חודשים|חודש) /);
  if(m){const n=parseInt(m[1])||NUMW[m[1]]||1;const u=m[2].startsWith('שבוע')?'week':m[2].startsWith('חודש')?'month':'day';r.repeat={every:n,unit:u,weekdays:[],skipSat:true};}
  m=cut(/ כל יום /);if(m&&!r.repeat)r.repeat={every:1,unit:'day',weekdays:[],skipSat:true};
  m=cut(/ כל (?:יום )?(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת) /);if(m){r.repeat={every:1,unit:'week',weekdays:[DAYN[m[1]]],skipSat:true};}
  if(cut(/ (?:לא|חוץ מ|בלי) ?בשבת /)){if(r.repeat)r.repeat.skipSat=true;}
  // window: between X and Y
  m=cut(/ בין (?:יום )?(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת) ל(?:יום )?(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת) /);
  if(m){r.date=nextDow(DAYN[m[1]]);r.window=nextDow(DAYN[m[2]],r.date);}
  // dates
  if(cut(/ (?:ב)?סוף השבוע /)){let c=T;for(let i=0;i<=7;i++){c=addDays(T,i);if(dow(c)===4&&c>T)break;}r.date=c;} // חמישי הקרוב
  if(cut(/ (?:ב)?תחילת החודש(?: הבא)? /)){const x=new Date(T+'T00:00:00');x.setMonth(x.getMonth()+1,1);r.date=ymd(x);}
  if(cut(/ (?:ב)?סוף החודש(?: הבא)? /)){const x=new Date(T+'T00:00:00');x.setMonth(x.getMonth()+1,0);let d=ymd(x);if(d<=T||addDays(T,3)>=d&&!t.includes('הבא')){x.setMonth(x.getMonth()+2,0);d=ymd(x);}r.date=d;}
  if(cut(/ (?:היום|הלילה|הערב) /))r.date=T;
  if(cut(/ מחרתיים /))r.date=addDays(T,2);
  else if(cut(/ מחר /))r.date=addDays(T,1);
  m=cut(/ בעוד (\d+|[א-ת]+) (ימים|יום|שבועות|שבוע|חודשים|חודש) /);
  if(m){const n=parseInt(m[1])||NUMW[m[1]]||1;const u=m[2];r.date=u.startsWith('שבוע')?addDays(T,7*n):u.startsWith('חודש')?addDays(T,30*n):addDays(T,n);}
  if(cut(/ בעוד שבועיים /))r.date=addDays(T,14);
  if(cut(/ בעוד שבוע /))r.date=addDays(T,7);
  if(cut(/ בעוד חודש /))r.date=addDays(T,30);
  m=cut(/ (?:ב)?(?:יום )?(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)(?: הקרוב| הבא)? /);
  if(m&&!r.date)r.date=nextDow(DAYN[m[1]]);
  m=cut(/ ב-?(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))? /);
  if(m){let y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):new Date().getFullYear();let d=y+'-'+pad(m[2])+'-'+pad(m[1]);if(!m[3]&&d<T)d=(+y+1)+'-'+pad(m[2])+'-'+pad(m[1]);r.date=d;}
  // time
  m=cut(/ (?:בשעה |ב-?)(\d{1,2})(?::(\d{2}))?(?: (בבוקר|בצהריים|אחר הצהריים|אחה"צ|בערב|בלילה))? /);
  if(m){let h=+m[1],mi=m[2]||'00';const p=m[3]||'';if((p==='בערב'||p==='אחר הצהריים'||p==='אחה"צ'||p==='בלילה'||p==='בצהריים')&&h<12)h+=12;if(h<24){r.time=pad(h)+':'+mi;if(!r.date)r.date=T;}}
  if(cut(/ בבוקר /)&&!r.time){r.time='09:00';if(!r.date)r.date=T;}
  if(cut(/ בערב /)&&!r.time){r.time='19:00';if(!r.date)r.date=T;}
  // list by name
  for(const l of lists){const re=new RegExp(' (?:ל|ב)?רשימת '+l.name+' ');if(t.match(re)){t=t.replace(re,' ');r.list=l.id;}}
  r.title=t.replace(/\s+/g,' ').replace(/^[\s,،-]+|[\s,،-]+$/g,'').trim();
  if(r.repeat&&!r.date)r.date=T;
  return r;
}

/* ===================== Contacts / WhatsApp ===================== */
const NM="([א-ת'\"״]{2,})(?=[\\s,.?!]|$)";
const NAME_PATS=[new RegExp("(?:^|\\s)(?:עם|אצל|אל)\\s+"+NM),new RegExp("(?:^|\\s)(?:להתקשר|לשלוח|לכתוב|להודיע|לענות|להזכיר|לחזור)\\s+ל-?"+NM),new RegExp("(?:^|\\s)(?:לשאול|לבקש|להזמין|לעדכן|לברר)\\s+(?:את|מ|עם)-?\\s*"+NM)];
const NAME_RE=new RegExp("(?:^|\\s)(?:עם|אצל|אל|להתקשר ל|לשלוח ל|לכתוב ל|להודיע ל|לשאול את|לבקש מ)-?"+NM);
const STOP=new Set(['מחר','היום','הבוקר','הערב','שבוע','חודש','בית','בנק','קופה','רופא','חנות','עבודה','גינה','מכולת','סופר','דואר','משרד','רופאה','אחות','ד"ר','דר','דוקטור','פרופ']);
function detectName(title){for(const re of NAME_PATS){const m=(' '+title).match(re);if(m){const n=m[1].trim();if(!STOP.has(n.split(' ')[0]))return n;}}return null;}
function findContact(name){if(!name)return null;const k=name.toLowerCase();return contacts.find(c=>c.name.toLowerCase()===k||(c.aliases||[]).some(a=>a.toLowerCase()===k))||contacts.find(c=>k.startsWith(c.name.toLowerCase())||c.name.toLowerCase().startsWith(k))||null;}
// loose Hebrew key: lowercase, strip spelling-only letters (י/ו) so באטריס / ביאטריס / בטריס all match
const looseKey=w=>String(w||'').toLowerCase().replace(/[^א-תa-z0-9]/g,'').replace(/[יוא]/g,'');
const contactKeys=c=>[c.name,...(c.aliases||[]),...(c.name||'').split(/\s+/).filter(w=>w.length>=3)];
function scanContacts(title){const t=' '+(title||'')+' ';
  // 1) exact word match (name, alias, or any word of the full name, with Hebrew prefixes ל/ו/ב/מ)
  for(const c of contacts){for(const n of contactKeys(c)){if(n&&new RegExp('[\\s,]-?(?:ל|ו|ב|מ|של|עם)?'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=[\\s,.?!:;]|$)').test(t))return c;}}
  // 2) loose match on the words of the title (spelling variants), words of 3+ letters only
  const words=t.split(/[\s,.?!:;]+/).filter(w=>w.length>=3);
  for(const c of contacts){const keys=contactKeys(c).map(looseKey).filter(k=>k.length>=3);
    for(const w of words){const lw=looseKey(w);if(!lw)continue;for(const k of keys){if(lw===k||(lw.length>k.length&&lw.endsWith(k)&&/^(ל|ו|ב|מ|ש|של|ול|וב|ומ)$/.test(lw.slice(0,lw.length-k.length))))return c;}}}
  return null;}
function contactFor(it){if(it.contact){const c=contacts.find(x=>x.id===it.contact);if(c)return {c,name:c.name};}const c=scanContacts(it.title)||findContact(detectName(it.title||''));if(c)return {c,name:c.name};const name=detectName(it.title||'');return {c:null,name};}
function addrStr(a){if(!a)return '';return [a.addressLine?.join(' '),a.city].filter(Boolean).join(', ')||a.toJSON?.()?.addressLine?.join(' ')||'';}
function wazeUrl(addr){return 'https://waze.com/ul?q='+encodeURIComponent(addr)+'&navigate=yes';}
function validPhone(p){return /^\d{10,15}$/.test(p||'');}
function waUrl(c,m){return 'https://wa.me/'+c.phone+(m?'?text='+encodeURIComponent(m):'');}
function normPhone(p){let d=String(p||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))d=d.slice(1);if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='972'+d.slice(1);if(d.startsWith('9720'))d='972'+d.slice(4);return d;}
function draftMessage(it,c){const name=c.name;
  let t=(' '+(it.title||'')+' ').replace(NAME_RE,' ');
  for(const n of [...name.split(' '),...(c.aliases||[])])t=t.replace(new RegExp('\\s-?(?:ל|ו|ב|מ|עם|אצל|את)?'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=[\\s,.?!])'),' ');
  t=t.replace(/\s(?:את|עם|אצל|אל|ל)(?=\s|$)/g,' ').replace(/\s+/g,' ').trim().replace(/^[-–:]\s*/,'').replace(/[-–:,]\s*$/,'');
  const first=name.split(' ')[0];
  const meeting=/קבוע|פגיש|טיפול|תור|להיפגש|ביקור/.test(t);
  if(/להתקשר|לדבר|שיחה/.test(it.title||''))return 'היי '+first+', אפשר לדבר בטלפון? מתי נוח לך?';
  if(!t)return 'היי '+first+',';
  if(/^ל[א-ת]/.test(t))return 'היי '+first+', אפשר '+t+'?'+(meeting?' מתי נוח לך?':'');
  return 'היי '+first+', בקשר ל'+t.replace(/^ה/,'')+'.'+(meeting?' מתי נוח לך?':'');
}
async function pickFromPhone(name,done){
  if(!(navigator.contacts&&navigator.contacts.select)){toast('הדפדפן לא תומך בבחירה מאנשי הקשר — הקלד ידנית');openContactSheet({name:name||''},done);return;}
  const one=v=>Array.isArray(v)?(v.find(x=>x&&String(x).trim())||''):(v==null?'':(typeof v==='object'?'':String(v)));
  let props=['name','tel'];
  try{if(navigator.contacts.getProperties){const sup=await navigator.contacts.getProperties();if(sup.includes('address'))props.push('address');}}catch(e){}
  let r;
  try{localStorage.setItem('pickstate','opened '+new Date().toLocaleTimeString('he-IL'));}catch(_){}
  // watchdog: Chrome sometimes never resolves the picker promise in an installed PWA — fall back to manual entry
  let settled=false,timer=null;
  const onVis=()=>{if(document.visibilityState==='visible'&&!settled){clearTimeout(timer);timer=setTimeout(()=>{if(!settled){settled=true;try{localStorage.setItem('pickstate','timeout (promise never resolved)');}catch(_){}toast('הטלפון לא החזיר את איש הקשר (באג של כרום באפליקציה מותקנת) — הקלד את המספר ידנית');openContactSheet({name:name||''},done);}},4000);}};
  document.addEventListener('visibilitychange',onVis);
  try{r=await navigator.contacts.select(props,{multiple:false});}
  catch(e){document.removeEventListener('visibilitychange',onVis);clearTimeout(timer);if(settled)return;settled=true;try{localStorage.setItem('pickstate','error '+(e&&e.message||e));}catch(_){}toast('בחירת אנשי קשר נכשלה ('+(e&&e.message||e)+') — הקלד ידנית');openContactSheet({name:name||''},done);return;}
  document.removeEventListener('visibilitychange',onVis);clearTimeout(timer);if(settled)return;settled=true;
  try{localStorage.setItem('pickstate','resolved '+(r?r.length:'null'));}catch(_){}
  if(!r||!r[0]){toast('לא נבחר איש קשר (הבוחר חזר ריק)');return;}
  const raw=r[0];
  try{localStorage.setItem('lastpick',JSON.stringify({name:raw.name,tel:raw.tel,address:raw.address&&raw.address.map?raw.address.map(a=>({line:a.addressLine,city:a.city,toJSON:typeof a.toJSON})):raw.address}));}catch(_){}
  const pn=one(raw.name).trim();
  const tel=one(raw.tel);
  const addr=Array.isArray(raw.address)?addrStr(raw.address[0]):(typeof raw.address==='string'?raw.address:'');
  const c={id:uid(),name:(name||pn).trim(),phone:normPhone(tel),aliases:pn&&pn!==(name||pn)?[pn]:[],address:addr};
  if(!validPhone(c.phone)){
    // the phone's picker returned no usable number -> let the user complete it, with what we got prefilled
    toast('מהטלפון התקבל: '+(pn||'(בלי שם)')+' / '+(tel||'(בלי מספר)')+' — השלם ידנית');
    openContactSheet({name:c.name,phone:tel,aliases:c.aliases,address:c.address},done);return;
  }
  try{contacts.push(c);await saveContacts();toast('נשמר: '+c.name+' '+c.phone);}catch(e){logErr('שמירת איש קשר: '+(e&&e.message||e));return;}
  try{done&&await done(c);}catch(e){logErr('אחרי בחירת איש קשר: '+(e&&e.message||e));}
}

/* ===================== Recurrence ===================== */
function skipDay(d,rep){const skip=(rep&&rep.skipSat!==false)||settings.skipSat;let n=0;while(n<8&&((skip&&dow(d)===6)||(rep&&rep.skipDays&&rep.skipDays.includes(dow(d))))){d=addDays(d,1);n++;}return d;}
function nextOccurrence(it,from){const rep=it.repeat;if(!rep)return null;let d;
  if(rep.unit==='day')d=addDays(from,rep.every||1);
  else if(rep.unit==='week'){if(rep.weekdays&&rep.weekdays.length){let c=from;for(let i=1;i<=7*(rep.every||1)+7;i++){c=addDays(from,i);if(rep.weekdays.includes(dow(c)))break;}d=c;}else d=addDays(from,7*(rep.every||1));}
  else {const x=new Date(from+'T00:00:00');x.setMonth(x.getMonth()+(rep.every||1));d=ymd(x);}
  return skipDay(d,rep);}
function repeatLabel(rep){if(!rep)return '';let s=rep.unit==='day'?(rep.every===1?'כל יום':'כל '+rep.every+' ימים'):rep.unit==='week'?(rep.weekdays&&rep.weekdays.length?'כל יום '+rep.weekdays.map(d=>DAYS[d]).join(', '):'כל שבוע'):'כל חודש';if(rep.skipSat!==false)s+=' (לא בשבת)';return s;}

/* ===================== Open-time maintenance ===================== */
async function maintenance(){
  const T=today();let changed=0;
  for(const it of items){
    if(it.status==='trash'&&it.deletedAt&&Date.now()-it.deletedAt>7*864e5){await purgeItem(it.id);continue;}
    if(it.status!=='open'||!it.date)continue;
    if(it.date<T){
      if(it.type==='cond'&&it.windowEnd&&it.windowEnd>=T){continue;}
      it.date=T;if(it.type==='task')it.rollovers=(it.rollovers||0)+1;await save(it);changed++;
    }
  }
  // topic list reminders roll forward automatically (they are just shown while due)
  return changed;
}

/* ===================== Duplicates (0.21) ===================== */
/* fingerprint: lower-case, strip punctuation/quotes/dashes, drop short function words, sorted token set */
const DUP_STOP=new Set(['את','של','על','עם','אל','גם','כבר','אולי','צריך','לא','או','ו','ה','ל','ב','מ','כ','the','a','to','and','of','for']);
function dupTokens(t){return String(t||'').toLowerCase().replace(/[״"'׳`.,;:!?()\[\]{}–—\-\/\\|+*#@&]/g,' ').split(/\s+/).map(w=>w.trim()).filter(w=>w&&!DUP_STOP.has(w));}
function dupFp(t){return [...new Set(dupTokens(t))].sort().join(' ');}
function dupSim(a,b){const A=new Set(dupTokens(a)),B=new Set(dupTokens(b));if(!A.size||!B.size)return 0;let inter=0;for(const w of A)if(B.has(w))inter++;return inter/(A.size+B.size-inter);}
function dupDateClose(a,b){if(!a.date||!b.date)return true;return Math.abs(new Date(a.date)-new Date(b.date))<=7*864e5;}
/* an open item that is the "same" task: identical fingerprint, or ≥80% shared words; dates within a week (or undated); same list when both have one */
function findDup(cand,strict=false){
  const fp=dupFp(cand.title);if(!fp)return null;
  for(const it of items){
    if(it.status!=='open'||it.id===cand.id)continue;
    if(cand.extId&&it.extId===cand.extId)return it;
    if(cand.list&&it.list&&cand.list!==it.list)continue;
    if(!dupDateClose(cand,it))continue;
    if(dupFp(it.title)===fp)return it;
    if(!strict&&dupSim(cand.title,it.title)>=0.8)return it;
  }
  return null;
}
function dupEvent(cand,twin,how){
  events.push({ts:new Date().toISOString(),type:'dup',id:twin.id,device:device?device.name:null,extId:cand.extId||null,title:cand.title,dupOf:twin.title,how});
  if(events.length>600)events=events.slice(-600);DB.kset('events',events).catch(()=>{});
}
/* one-time cleanup of duplicates that already slipped in: identical fingerprint among open tasks → keep the oldest, move the rest to trash (recoverable for 7 days) */
async function dedupExisting(){
  if(await DB.kget('dedup21'))return 0;
  const open=items.filter(i=>i.status==='open'&&i.type!=='topic').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  let n=0;
  for(let i=0;i<open.length;i++){const a=open[i];if(a.status!=='open')continue;const fa=dupFp(a.title);if(!fa)continue;
    for(let j=i+1;j<open.length;j++){const b=open[j];if(b.status!=='open')continue;
      if(a.list&&b.list&&a.list!==b.list)continue;if(!dupDateClose(a,b))continue;
      if(dupFp(b.title)===fa){if(a.note&&!b.note){}else if(b.note&&!a.note){a.note=b.note;}b.status='trash';b.deletedAt=Date.now();dupEvent(b,a,'cleanup');await save(b);await save(a);n++;}
    }}
  await DB.kset('dedup21',Date.now());
  if(n)toast('נוקו '+n+' משימות כפולות (נמצאות בסל המחזור)');
  return n;
}

/* ===================== Inbox from Claude ===================== */
async function pullInbox(){
  try{
    const res=await fetch('inbox.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)return;
    const data=await res.json();
    const imported=importedSet;let n=0,dups=0;
    for(const t of (data.tasks||[])){
      if(!t.id||imported.has(t.id))continue;
      if(items.some(x=>x.extId===t.id)){imported.add(t.id);continue;} // 0.19: already received via another device
      const cand={title:t.title||'',date:t.date||null,list:t.list||null,extId:t.id};
      const twin=findDup(cand);if(twin){dupEvent(cand,twin,'inbox');imported.add(t.id);dups++;continue;} // 0.21: same task already open → skip
      const it=newItem({title:t.title||'',note:t.note||'',date:t.date||(t.list?null:today()),time:t.time||null,source:t.source||'claude',list:t.list||null,extId:t.id,type:t.type||'task',condition:t.condition||'',url:t.url||null});
      if(t.repeat)it.repeat=t.repeat;
      await save(it);imported.add(t.id);n++;
    }
    await DB.kset('imported',[...imported]);
    if(data.calendar){await DB.kset('calendar',data.calendar);await DB.kset('calendarAt',data.generated||Date.now());}
    if(n||dups)toast('נקלטו '+n+' פריטים חדשים'+(dups?' · דולגו '+dups+' כפולים':''));
  }catch(e){/* offline */}
}

/* 0.24.2: guess a contact name from a notice title: "…בחנות סטימצקי, נשר" → "סטימצקי נשר"; "מרפאת שיניים ד"ר כהן" → as is */
function guessContactName(it){const t=(it.title||'').replace(/[.!?]+$/,'');
  const STOPW=/\s+(?:נקבע|נקבעה|ממתינ[הת]?|מחכ[הה]?|ליום|בשעה|ב-?\d|מחר|היום|עד|לפרטים|טלפון|בתאריך)(?![א-ת])[\s\S]*$/;
  let m=t.match(/(?:^|\s)ב(מרפאת|מרפאה|חנות|סניף|קליניקת|מסעדת|קפה|מעבדת|משרד)\s+([^,.:]{2,40})(?:,\s*([א-ת\s"']{2,20}))?/);
  if(m)return (m[1]+' '+m[2].replace(STOPW,'')+(m[3]?' '+m[3]:'')).replace(/\s{2,}/g,' ').trim();
  m=t.match(/(?:^|\s)(?:בנקודת האיסוף|אצל|של|מ)\s+([^,.:]{2,40})(?:,\s*([א-ת\s"']{2,20}))?/);
  if(m)return (m[1].replace(STOPW,'')+(m[2]?' '+m[2]:'')).replace(/\s{2,}/g,' ').trim();
  const d=detectName(t);if(d)return d;return t.replace(STOPW,'').slice(0,30).trim();}

  if(searchQ.trim()){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-search'));renderSearch();updateBadge();return;}
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+view));
  updateStatus();
  try{if(view==='today')await renderToday();else if(view==='lists')renderLists();else if(view==='log')renderLog();else renderMore();}
  catch(e){const msg=(e&&e.message)||String(e);try{logErr('render '+view+': '+msg);}catch(_){}
    if(view==='more')document.getElementById('v-more').innerHTML=`<h2>⚠️ שגיאה בטעינת המסך</h2><div class="card" style="display:block"><div class="small" dir="auto">${esc(msg)}</div><div class="btns" style="margin-top:8px"><button class="btn p" id="updBtn">🔄 בדוק עדכון</button><button class="btn" id="errBtn">🐞 יומן שגיאות</button><button class="btn" id="exportBtn">ייצוא לקובץ</button></div></div><h2>ℹ️ אודות</h2><div class="small" style="padding:0 8px">My Doing · גרסה ${APP_VER}</div>`;
    else toast('שגיאה בתצוגה: '+msg.slice(0,80));}
  updateBadge();
}

/* ===================== Actions ===================== */
/* 0.25: "done" = saved at once; the card turns green for 5 s with "בטל", then moves to "בוצעו היום".
   The outbox event and the next occurrence of a repeating task are written only when the 5 s pass, so an undo leaves no trace. */
const pendingDone=new Map();
async function complete(it){
  if(pendingDone.has(it.id))return;
  it.status='done';it.doneAt=Date.now();it.updatedAt=Date.now();
  await DB.put(it);markDirty();               // saved immediately (survives leaving the screen or the app)
  pendingDone.set(it.id,setTimeout(()=>finishDone(it.id),5000));
  if(view!=='today'&&view!=='lists'){toast('בוצע ✓');}
  render();
}
async function finishDone(id){
  pendingDone.delete(id);
  const it=items.find(x=>x.id===id);if(!it||it.status!=='done')return;
  trackEvent(it);                              // outbox: 'done' event
  if(it.repeat){const nd=nextOccurrence(it,today());const nx=newItem({title:it.title,note:it.note,time:it.time,list:it.list,source:it.source,repeat:it.repeat,date:nd});await save(nx);}
  const el=document.querySelector('.nc .card.pend[data-id="'+id+'"]');
  if(el&&view==='today'){el.classList.add('leaving');await new Promise(r=>setTimeout(r,300));}
  render();
}
async function undoDone(it){
  const t=pendingDone.get(it.id);if(t){clearTimeout(t);pendingDone.delete(it.id);}
  it.status='open';it.doneAt=null;it.updatedAt=Date.now();
  await DB.put(it);markDirty();render();
}

function openSnooze(it){

  openSheet(`<h3>⏰ דחייה: ${esc(it.title)}</h3>
    <div class="btns">${opts.map(([n,d])=>`<button class="btn p" data-sn="${d}">${n}<br><span style="font-weight:400;font-size:12px">${fmtDate(d)}</span></button>`).join('')}</div>
    <div class="btns"><button class="btn" data-sn="none">בלי תאריך</button><label class="btn" style="display:inline-block">תאריך אחר… <input type="date" id="snDate" style="display:none"></label></div>
    <label class="lbl">או להעביר לרשימה</label>

    <div class="btns" style="margin-top:12px"><button class="btn" id="snClose">סגור</button></div>`);
  const sh=document.getElementById('sheet');
  const apply=async(d,msg)=>{it.date=d;it.rollovers=0;await save(it);closeSheet();await render();toast(msg);};
  sh.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{const v=b.dataset.sn;if(v==='none')apply(null,'הוסר התאריך — נמצא ברשימות');else apply(v,'נדחה ל'+fmtDate(v));});
  sh.querySelectorAll('[data-snl]').forEach(b=>b.onclick=async()=>{it.list=b.dataset.snl;if(!it.date||it.date<=T)it.date=null;it.rollovers=0;await save(it);closeSheet();await render();toast('הועבר לרשימת '+(lists.find(l=>l.id===it.list)||{}).name);});
  const di=document.getElementById('snDate');di.onchange=()=>{if(di.value)apply(di.value,'נדחה ל'+fmtDate(di.value));};di.parentElement.onclick=()=>{try{di.showPicker();}catch(e){di.style.display='inline-block';}};

async function trash(it){const prev=it.status;it.status='trash';it.deletedAt=Date.now();await save(it);toast('הועבר לסל','בטל',async()=>{it.status=prev==='trash'?'open':prev;it.deletedAt=null;await save(it);await render();toast('שוחזר');});}
document.querySelector('main').addEventListener('click',async e=>{
  const mo=e.target.closest('[data-more]');if(mo){const k=mo.dataset.more;if(k==='menu'||k==='back')goBack();else if(k==='whatsnew')openWhatsNew();else goSub(k);return;}
  const b=e.target.closest('[data-act],[data-lact],[data-set],[data-cact]');if(!b)return;
  if(b.dataset.cact){if(b.dataset.cact==='new')openContactSheet({});else{const c=contacts.find(x=>x.id===b.closest('[data-cid]').dataset.cid);if(c){if(b.dataset.cact==='open')openContactCard(c);else openContactSheet(c);}}return;}
  if(b.dataset.set){settings[b.dataset.set]=b.dataset.val==='1';await saveSettings();render();return;}
  if(b.dataset.lact){const lid=b.dataset.list||b.closest('[data-list]')?.dataset.list;const l=lists.find(x=>x.id===lid);
    const a=b.dataset.lact;
    if(a==='menu'){e.preventDefault();openListMenu(l,b);return;}
    if(a==='new'){openListSheet(null);return;}
    if(a==='rename'){openListSheet(l);return;}
    if(a==='remind'){openListRemind(l);return;}
    if(a==='addto'){openEdit(newItem({list:lid,source:'manual'}),true);return;}
    if(a==='open'){show('lists');return;}
    if(a==='snooze7'||a==='snooze30'){l.remind.date=addDays(today(),a==='snooze7'?7:30);await saveLists();render();return;}
    if(a==='off'){if(l.remind&&l.remind.repeat){l.remind.date=nextOccurrence({repeat:l.remind.repeat},today());}else l.remind=null;await saveLists();render();return;}
    return;}
  const a=b.dataset.act;
  if(a==='hideEv'){const id=b.closest('[data-ev]').dataset.ev;const hid=new Set((await DB.kget('hiddenEvents'))||[]);hid.add(id);await DB.kset('hiddenEvents',[...hid]);render();return;}
  const card=b.closest('[data-id]');if(!card)return;const it=items.find(x=>x.id===card.dataset.id);if(!it)return;
  switch(a){
    case 'done': if(it.status==='done'&&!pendingDone.has(it.id)){it.status='open';it.doneAt=null;await save(it);}else if(pendingDone.has(it.id)){await undoDone(it);return;}else await complete(it);return;
    case 'undo': await undoDone(it);return;
    case 'menu': openCardMenu(it,b);return;
    case 'followup': openFollowUp(it);return;
    case 'edit': openEdit(it);return;
    case 'checklist': openChecklist(it);return;
    case 'decode': openEdit(it);setTimeout(()=>{const b=document.getElementById('decodeBtn');if(b)b.click();},150);return;
    case 'trash': await trash(it);break;
    case 'restore': it.status='open';it.deletedAt=null;await save(it);toast('שוחזר');break;
    case 'purge': await purgeItem(it.id);break;
    case 'reopen': await reopenTask(it);return;
    case 'logMenu': openLogMenu(it,b);return;
    case 'openLog': openLogCard(it);return;
    case 'snooze': openSnooze(it);return;
    case 'snooze7': it.date=addDays(today(),7);it.rollovers=0;await save(it);break;
    case 'snooze30': it.date=addDays(today(),30);await save(it);break;
    case 'tolist': openEdit(it);return;
    case 'condYes': it.type='task';it.condition='';it.date=today();await save(it);toast('נוצרה משימה');break;
    case 'condNo': it.status='closed';it.doneAt=Date.now();await save(it);toast('נרשם ביומן: לא נדרש');break;
    case 'toTask': it.type='task';it.date=today();await save(it);break;
    case 'wa': {const {c}=contactFor(it);if(c)openWhatsApp(it,c);return;}
    case 'contact': {const {c}=contactFor(it);if(c)openContactActions(it,c);return;}
    case 'waze': {const {c}=contactFor(it);if(c&&c.address)window.open(wazeUrl(c.address),'_blank');return;}
    case 'nav': {const a=it.addr||((contactFor(it).c||{}).address);if(a){const w=window.open(wazeUrl(a),'_blank');if(!w)location.href=wazeUrl(a);}return;}
    case 'call': {if(it.phone)location.href='tel:'+String(it.phone).replace(/[^\d+*#]/g,'');return;}
    case 'addAddr': openFillField(it,'addr');return;
    case 'addPhone': openFillField(it,'phone');return;
    case 'toContact': {const c={name:guessContactName(it),phone:normPhone(it.phone),aliases:[],address:it.addr||''};openContactSheet(c,async cc=>{it.contact=cc.id;await save(it);await render();toast('נשמר איש קשר: '+cc.name);});return;}
    case 'pick': {const {name}=contactFor(it);window.__pickItem=it;pickContact(name,async c=>{try{it.contact=c.id;await save(it);await render();}catch(e){logErr('קישור משימה לאיש קשר: '+(e&&e.message||e));}openContactActions(it,c);});return;}
  }
  render();
});

/* 0.25: what exactly was saved — title · time · date — with "בטל" for a new item */
function savedToast(it,isNew,prefix='✓ נשמר'){
  const l=it.list&&lists.find(x=>x.id===it.list);
  const when=it.date?fmtDate(it.date):(l?'ללא תאריך · ברשימת '+l.name:'ללא תאריך');
  const msg=prefix+': '+it.title.slice(0,48)+(it.time?' · '+it.time:'')+' · '+when;
  if(isNew)toast(msg,'בטל',async()=>{it.status='trash';it.deletedAt=Date.now();await save(it);render();toast('בוטל');});
  else toast(msg,'סגור',()=>{});
}
/* ===================== Quick add ===================== */
const quick=document.getElementById('quick'),hint=document.getElementById('hint');
quick.addEventListener('input',()=>{const p=parseHebrew(quick.value);const parts=[];{const tl=quickTargetList();if(tl&&!p.list)parts.push('לרשימת '+tl.name);}if(p.date)parts.push(fmtDate(p.date));if(p.time)parts.push(p.time);if(p.repeat)parts.push(repeatLabel(p.repeat));if(p.condition)parts.push('תנאי: '+p.condition);if(p.topic)parts.push('תזכורת לנושא');if(p.list)parts.push('רשימת '+(lists.find(l=>l.id===p.list)||{}).name);hint.textContent=quick.value.trim()?(parts.join(' · ')||'יתווסף להיום'):'';});
quick.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();quickAdd();}});
document.getElementById('addBtn').onclick=()=>{if(quick.value.trim())quickAdd();else openEdit(newItem({date:today()}),true);};
const WA_TS=/\[\s*\d{1,2}[./]\d{1,2}(?:[./]\d{2,4})?,?\s+\d{1,2}:\d{2}(?::\d{2})?\s*\]\s*[^:\n]{1,40}:/; // WhatsApp timestamp + sender
/* 0.24: does pasted text look like a forwarded notice (SMS / shop / clinic) rather than a typed task? */
function looksLikeNotice(t){if(t.length<60)return false;return /https?:\/\//.test(t)||STREET_RE.test(t)||!!extractPhone(t)||/^(שלום|היי|לקוח)/.test(t)||t.split(/[.!?\n]+/).filter(x=>x.trim().length>3).length>=3;}
quick.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text')||'';if(quick.value.trim()||!(WA_TS.test(t)||looksLikeNotice(t)))return;e.preventDefault();quick.value='';hint.textContent='';openShared({title:'',text:t,url:''});}); // the single-line field would lose the newlines — take the clipboard text as-is
async function quickAdd(source='manual'){
  const raw=quick.value.trim();if(!raw)return;
  if(WA_TS.test(raw)||looksLikeNotice(raw)){quick.value='';hint.textContent='';openShared({title:'',text:raw,url:''});return;} // 0.23.5: a pasted WhatsApp chat goes through the smart parser, not the plain one
  const it=buildFromText(raw,source);
  if(it.type==='topic'&&!it.date){openEdit(it,true);return;}
  const twin=findDup(it);
  if(twin){quick.value='';hint.textContent='';dupEvent(it,twin,'quick');toast('כבר קיימת: "'+twin.title.slice(0,40)+'"','הוסף בכל זאת',async()=>{await save(it);toast('נוסף: '+it.title);render();});return;}
  await save(it);quick.value='';hint.textContent='';savedToast(it,true);render();quickTarget();
}
function buildFromText(raw,source){
  const p=parseHebrew(raw);
  const it=newItem({title:p.title||raw,raw,date:p.date||(p.condition||p.topic?null:today()),time:p.time,repeat:p.repeat,source,condition:p.condition,windowEnd:p.window,list:p.list});
  if(p.condition)it.type='cond';
  if(p.topic){it.type='topic';const l=lists.find(x=>p.title.includes(x.name));if(l)it.list=l.id;}
  if(source==='manual'||source==='voice'){const tl=quickTargetList();if(tl&&!it.list&&it.type==='task'){it.list=tl.id;if(!p.date)it.date=null;}} // 0.22: typed while a list is open → into that list, undated
  if(!it.date&&it.type==='task'&&!it.list)it.date=today();
  return it;
}

/* ===================== Voice ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.getElementById('micBtn');let rec=null,recOn=false;
if(!SR){mic.title='זיהוי דיבור לא נתמך בדפדפן זה';}
mic.onclick=()=>{
  if(!SR){toast('זיהוי דיבור לא זמין כאן — נסה ב-Chrome');return;}
  if(recOn){rec.stop();return;}
  rec=new SR();rec.lang='he-IL';rec.interimResults=true;rec.continuous=false;let finalT='';
  rec.onstart=()=>{recOn=true;mic.classList.add('rec');hint.textContent='מקשיב… דבר עכשיו';};
  rec.onresult=e=>{let s='';for(const r of e.results){s+=r[0].transcript;if(r.isFinal)finalT=s;}quick.value=s;quick.dispatchEvent(new Event('input'));};
  rec.onerror=e=>{toast('שגיאת הקלטה: '+e.error);};
  rec.onend=()=>{recOn=false;mic.classList.remove('rec');const t=(finalT||quick.value).trim();if(t){const it=buildFromText(t,'voice');quick.value='';hint.textContent='';openEdit(it,true);}};
  rec.start();
};

const sheet=document.getElementById('sheet'),sheetBg=document.getElementById('sheetBg');
function openSheet(html){sheet.innerHTML=html;sheet.classList.add('on');sheetBg.classList.add('on');decorateDT(sheet);}
/* 0.20: Chrome shows <input type=date/time> in the browser's locale (mm/dd/yyyy, AM/PM on an English PC). Overlay a transparent native input on an Israeli-formatted label; taps still open the native picker. */
function fmtDMY(v){if(!v)return '';const d=new Date(v+'T00:00:00');if(isNaN(d))return v;return 'יום '+DAYS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();}
function decorateDT(root){for(const inp of root.querySelectorAll('input[type=date],input[type=time]')){if(inp.closest('.dt')||inp.style.display==='none')continue;
  const w=document.createElement('span');w.className='dt';inp.parentNode.insertBefore(w,inp);const v=document.createElement('span');v.className='dtv';w.appendChild(v);w.appendChild(inp);
  const upd=()=>{const x=inp.value;v.textContent=x?(inp.type==='date'?fmtDMY(x):x):(inp.type==='date'?'בחר תאריך…':'שעה…');v.classList.toggle('ph',!x);};inp.addEventListener('input',upd);inp.addEventListener('change',upd);upd();
  w.addEventListener('click',e=>{if(e.target!==inp){try{inp.showPicker&&inp.showPicker();}catch(_){inp.focus();}}});}}
function closeSheet(){sheet.classList.remove('on');sheetBg.classList.remove('on');}
sheetBg.onclick=closeSheet;

/* ===================== Photo → list (Claude API) ===================== */
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const max=1400;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82));};img.src=URL.createObjectURL(file);});}
async function ocrList(dataUrl){
  if(!settings.apiKey)throw new Error('אין מפתח API — הצילום נשמר. הגדר מפתח ב"עוד → הגדרות" ולחץ שוב "פענח רשימה", או הוסף פריטים ידנית.');
  if(!navigator.onLine)throw new Error('אין רשת — הצילום נשמר. לחץ "פענח רשימה" כשיש חיבור.');
  const b64=dataUrl.split(',')[1];
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:settings.model||'claude-sonnet-5-5',max_tokens:4000,system:'You read handwritten shopping lists written by an Israeli, mixing Hebrew (cursive handwriting, read right-to-left) and English. Read every line carefully; Hebrew cursive letters look different from print — think about which common Israeli grocery item fits the strokes (e.g. שניצלים, חלב, ביצים, לחם, עגבניות, מלפפונים, בצל, שום, לימונים, שמן, קמח, סוכר, גבינה, יוגורט, בשר טחון, עוף). Prefer a best guess over "לא קריא"; add "?" after a word only if truly uncertain. Output ONLY a JSON array, no prose, no markdown fences. Each element: {"t":"item with quantity if written","done":false}. A line struck through = "done":true. Keep each paper line as one item.',messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:'זו רשימת קניות בכתב יד בעברית. החזר אך ורק JSON: מערך של אובייקטים {"t":"שם הפריט עם כמות אם כתובה","done":true/false}. פריט שמחוק בקו (קו חוצה עליו) = done:true (כבר נקנה); פריט לא מחוק = done:false. פריט אחד לכל שורה, לפי סדר השורות מלמעלה למטה. אם שורה לא קריאה בכלל, כתוב "לא קריא". בלי טקסט נוסף.'}]}]})});
  if(res.status===401)throw new Error('מפתח API לא תקין (401). בדוק ב"עוד → הגדרות".');
  if(!res.ok){let d='';try{d=(await res.json()).error?.message||'';}catch(e){}throw new Error('שגיאת API ('+res.status+')'+(d?': '+d.slice(0,160):''));}
  const j=await res.json();const txt=(j.content||[]).map(c=>c.text||'').join('').trim();
  const norm=x=>typeof x==='string'?{t:x.trim(),done:false}:(x&&typeof x==='object')?{t:String(x.t||x.item||x.name||x.text||'').trim(),done:!!(x.done||x.crossed||x.bought)}:null;
  // 1) JSON array anywhere in the text (also inside ```json fences)
  const m=txt.match(/\[[\s\S]*\]/);
  if(m){try{const arr=JSON.parse(m[0]);if(Array.isArray(arr)){const out=arr.map(norm).filter(c=>c&&c.t);if(out.length)return out;}}catch(e){}}
  // 1b) tolerant: pull {"t":"…","done":…} pairs straight out of the text, even if the JSON is broken (e.g. ק"ג inside a string) or truncated
  const pairs=[...txt.matchAll(/"t"\s*:\s*"(.*?)"\s*,\s*"done"\s*:\s*(true|false)/g)].map(x=>({t:x[1].trim(),done:x[2]==='true'})).filter(c=>c.t);
  if(pairs.length)return pairs;
  const loose=[...txt.matchAll(/"t"\s*:\s*"([^\n]*?)"\s*[,}]/g)].map(x=>({t:x[1].trim(),done:false})).filter(c=>c.t);
  if(loose.length)return loose;
  // 2) JSON object holding an array
  const o=txt.match(/\{[\s\S]*\}/);
  if(o){try{const obj=JSON.parse(o[0]);const arr=Object.values(obj).find(v=>Array.isArray(v));if(arr){const out=arr.map(norm).filter(c=>c&&c.t);if(out.length)return out;}}catch(e){}}
  // 3) plain text: one item per line
  const lines=txt.replace(/```[a-z]*/g,'').split('\n').map(s=>s.replace(/^[\s\-\*•·\d\.\)\]"'\[,]+|[\s"',\]]+$/g,'').trim()).filter(s=>s&&!/^(json|רשימה|רשימת קניות)[:：]?$/i.test(s));
  const out=lines.map(s=>{const done=/~~|\(מחוק\)|\(נקנה\)|✓/.test(s);return {t:s.replace(/~~|\(מחוק\)|\(נקנה\)|✓/g,'').trim(),done};}).filter(c=>c.t&&c.t.length<80);
  if(out.length)return out;
  throw new Error('לא זוהו פריטים. תשובת המודל: '+(txt.slice(0,400)||'(ריקה) · stop='+(j.stop_reason||'?')+' · raw='+JSON.stringify(j).slice(0,500)));
}

/* ===================== GitHub sync: outbox + encrypted backup (0.18) ===================== */
const GH={owner:'modiaviram-arch',repo:'garden-recipes',branch:'main',outbox:'doing/outbox.json',backup:'doing/backup.json',syncDir:'doing/sync'};
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
const utf8b64=str=>b64(new TextEncoder().encode(str));
async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}?ref=${GH.branch}`,{headers:{Authorization:'Bearer '+settings.ghToken,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status+(r.status===401?' — טוקן לא תקין':r.status===403?' — אין הרשאה לריפו':''));return r.json();
}
async function ghPut(path,content,message){
  const cur=await ghGet(path);
  const body={message,content:utf8b64(content),branch:GH.branch};if(cur&&cur.sha)body.sha=cur.sha;
  const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+settings.ghToken,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let m='';try{m=(await r.json()).message||'';}catch(e){}throw new Error('GitHub '+r.status+(r.status===401?' — טוקן לא תקין':r.status===403?' — לטוקן אין הרשאת כתיבה':r.status===409?' — התנגשות, נסה שוב':'')+(m?' ('+m+')':''));}
  return r.json();
}
/* ---- encryption: PBKDF2 (310k, SHA-256) -> AES-GCM-256 ---- */
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptJSON(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {v:1,alg:'AES-GCM-256/PBKDF2-SHA256-310k',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))};}
async function decryptJSON(env,pass){const key=await deriveKey(pass,unb64(env.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.data));return JSON.parse(new TextDecoder().decode(pt));}
/* ---- what goes out ---- */
function exportData(){return {exported:new Date().toISOString(),app:APP_VER,items,lists,contacts,settings:{skipSat:settings.skipSat,model:settings.model,syncAuto:settings.syncAuto},imported:[...importedSet],tombs,deviceId:device&&device.id,deviceName:device&&device.name};}
function buildOutbox(lastSyncAt){
  const T=today();const since=lastSyncAt?new Date(lastSyncAt).toISOString():null;
  const recent=events.filter(e=>!since||e.ts>since);

    else if(key==='N'&&!out.name){const p=val.split(';');out.name=[p[1],p[0]].filter(Boolean).join(' ').trim();}
    else if(key==='TEL'){const d=normPhone(val);if(validPhone(d)&&!out.phones.includes(d))out.phones.push(/CELL|MOBILE/.test(head)?d:d);}

function parseContactText(t){

    for(const k of ['mobile','cell','נייד','phone','טלפון','work','home phone']){if(fields[k]){const d=normPhone(fields[k]);if(validPhone(d)&&!out.phones.includes(d))out.phones.push(d);}}
    for(const k of Object.keys(fields)){if(out.phones.length)break;const d=normPhone(fields[k]);if(validPhone(d)&&/\d{7,}/.test(fields[k].replace(/\D/g,'')))out.phones.push(d);}

    let take=!cur||ru>lu||(ru===lu&&cur&&rank(it.status)>rank(cur.status));
    if(take){
      if(cur){if((cur.rollovers||0)>(it.rollovers||0))it.rollovers=cur.rollovers;if(Math.abs(ru-lu)<10*60e3&&(cur.title!==it.title||cur.status!==it.status))conf++;Object.assign(cur,it);await DB.put(cur);shadow.set(cur.id,shape(cur));}
      else{items.push(it);await DB.put(it);shadow.set(it.id,shape(it));}
      n++;
    }else if(cur&&(it.rollovers||0)>(cur.rollovers||0)){cur.rollovers=it.rollovers;await DB.put(cur);}
  }
  let lch=false;for(const l of (d.lists||[]))if(l&&l.id&&!lists.some(x=>x.id===l.id)){lists.push(l);lch=true;}if(lch)await DB.kset('lists',lists);
  let cch=false;for(const c of (d.contacts||[]))if(c&&c.id&&!contacts.some(x=>x.id===c.id)){contacts.push(c);cch=true;}if(cch)await DB.kset('contacts',contacts);
  let ich=false;for(const id of (d.imported||[]))if(!importedSet.has(id)){importedSet.add(id);ich=true;}if(ich)await DB.kset('imported',[...importedSet]);
  if(d.events&&d.events.length){const key=e=>e.ts+'|'+e.type+'|'+e.id;const have=new Set(events.map(key));let ech=false;for(const e of d.events)if(!have.has(key(e))){events.push(e);have.add(key(e));ech=true;}if(ech){events.sort((a,b)=>a.ts<b.ts?-1:1);if(events.length>600)events=events.slice(-600);await DB.kset('events',events);}}
  await DB.kset('tombs',tombs);
  if(n)dirty=true; // our file should carry the merged state too
  if(n)syncLog('מוזג מ'+who+': '+n+' פריטים'+(conf?' ('+conf+' שונו בשני המכשירים — החדש נשמר)':''));
  if(conf)toast(conf+' פריטים שונו גם במכשיר אחר — נשמרה הגרסה החדשה יותר');
  return n;
}
async function ghRaw(path){const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}?ref=${GH.branch}`,{headers:{Authorization:'Bearer '+settings.ghToken,Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);return r.text();}
let pullingDev=false;
async function pullDevices(force){
  if(!canDevSync()||!navigator.onLine||pullingDev)return 0;
  const last=(await DB.kget('lastPullDev'))||0;if(!force&&Date.now()-last<5*60e3)return 0;
  pullingDev=true;let total=0;
  try{
    const dir=await ghGet(GH.syncDir);const files=Array.isArray(dir)?dir.filter(f=>f.type==='file'&&f.name.endsWith('.json')&&f.name!==device.id+'.json'):[];
    const shas=(await DB.kget('devShas'))||{};const devs=(await DB.kget('devices'))||{};
    if(!files.length){
      // bootstrap: no other device has written a sync file yet — merge backup.json once (same password, same merge)
      if(!(await DB.kget('bootstrapped'))){try{const r=await fetch('backup.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){const env=await r.json();if(env&&env.data){const d=await decryptJSON(env,settings.backupPass);total+=await mergeRemote(d,'הגיבוי בריפו');}}}catch(e){syncLog('אתחול מהגיבוי נכשל: '+(e.message||e));}await DB.kset('bootstrapped',1);}
    }
    for(const f of files){
      if(shas[f.name]===f.sha){continue;}
      let env;try{env=JSON.parse(await ghRaw(f.path));}catch(e){syncLog('קובץ '+f.name+' לא נקרא: '+(e.message||e));continue;}
      let d;try{d=await decryptJSON(env,settings.backupPass);}catch(e){syncLog('סיסמה שונה במכשיר "'+(env.deviceName||f.name)+'" — לא מוזג');devs[f.name]={name:env.deviceName||f.name,generated:env.generated,error:'סיסמה שונה'};continue;}
      const n=await mergeRemote(d,'"'+(d.deviceName||f.name)+'"');total+=n;shas[f.name]=f.sha;
      devs[f.name]={name:d.deviceName||f.name,generated:d.generated,app:d.app,mergedAt:Date.now(),received:n,items:(d.items||[]).length};
    }
    await DB.kset('devShas',shas);await DB.kset('devices',devs);await DB.kset('lastPullDev',Date.now());await DB.kset('lastPullDevErr','');
    if(total){await maintenance();toast('התקבלו '+total+' עדכונים ממכשיר אחר');}
  }catch(e){await DB.kset('lastPullDevErr',(e&&e.message)||String(e));syncLog('משיכה: '+((e&&e.message)||e));throw e;}
  finally{pullingDev=false;if(view==='more')fillDevLine();}
  return total;
}
let dirty=false,pushT=null,pushing=false;
function markDirty(){dirty=true;updateStatus();if(!canDevSync())return;clearTimeout(pushT);pushT=setTimeout(()=>pushDevice(false).catch(()=>{}),30000);}
function flushPush(){if(dirty&&canDevSync()){clearTimeout(pushT);pushDevice(false).catch(()=>{});}}
async function pushDevice(force){
  if(!canDevSync()||!navigator.onLine||pushing)return false;if(!dirty&&!force)return false;
  pushing=true;
  try{
    const env=await encryptJSON(syncPayload(),settings.backupPass);env.v=1;env.deviceId=device.id;env.deviceName=device.name;env.generated=new Date().toISOString();env.app=APP_VER;env.items=items.filter(i=>i.status!=='trash').length;
    await ghPut(GH.syncDir+'/'+device.id+'.json',JSON.stringify(env),'sync '+device.name+': '+new Date().toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}));
    dirty=false;await DB.kset('lastPushDev',Date.now());await DB.kset('lastPushDevErr','');return true;
  }catch(e){await DB.kset('lastPushDevErr',(e&&e.message)||String(e));syncLog('דחיפה: '+((e&&e.message)||e));throw e;}
  finally{pushing=false;updateStatus();if(view==='more')fillDevLine();}
}
async function devSyncNow(){
  if(!settings.ghToken){toast('קודם הזן טוקן GitHub');return;}if(!settings.backupPass){toast('סנכרון בין מכשירים דורש סיסמת הצפנה (זהה בשני המכשירים)');return;}if(!navigator.onLine){toast('אין רשת');return;}
  const line=document.getElementById('devLine');if(line)line.textContent='מסנכרן מכשירים…';
  try{const n=await pullDevices(true);await pushDevice(true);await render();toast(n?'התקבלו '+n+' עדכונים · הקובץ שלך נשלח ✓':'אין עדכונים חדשים · הקובץ שלך נשלח ✓');}
  catch(e){toast('סנכרון מכשירים נכשל: '+((e&&e.message)||e));}
}
async function fillDevLine(){const e=document.getElementById('devLine');if(!e)return;
  if(!canDevSync()){e.textContent='סנכרון בין מכשירים: לא פעיל (דרושים טוקן וסיסמת הצפנה).';return;}
  const devs=(await DB.kget('devices'))||{};const lp=await DB.kget('lastPullDev'),lpe=await DB.kget('lastPullDevErr'),lpush=await DB.kget('lastPushDev'),lpushe=await DB.kget('lastPushDevErr');
  const f=t=>t?new Date(t).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}):'—';
  let h='מכשיר זה: <b>'+esc(device.name)+'</b> · נשלח '+f(lpush)+(lpushe?' · שגיאת שליחה: '+esc(lpushe):'')+' · נמשך '+f(lp)+(lpe?' · שגיאת משיכה: '+esc(lpe):'')+(dirty?' · יש שינויים שטרם נשלחו':'');
  const others=Object.values(devs);
  h+=others.length?'<br>מכשירים אחרים: '+others.map(d=>esc(d.name)+' (עדכן '+(d.generated?f(d.generated):'?')+(d.error?', '+esc(d.error):d.received?', התקבלו '+d.received:'')+')').join(' · '):'<br>עדיין לא נמצאו מכשירים אחרים.';
  e.innerHTML=h;
}
/* ===================== Boot ===================== */
(async function(){
  await openDB();await load();
  if(!(await DB.kget('lists')))await saveLists();
  await maintenance();await dedupExisting();
  await render();
  let shared=false;
  if(new URL(location.href).searchParams.get('shared')==='1'){history.replaceState(null,'',location.pathname);const pl=await takeSharedPayload();if(pl){if(!(await handleSharedContact(pl))){const t=[pl.title,pl.text,pl.url].filter(Boolean).join(' ').trim();if(t){openShared(pl);}}shared=true;}}
  if(!shared)shared=handleShare();
  await pullInbox();await maintenance();await render();checkUpdate(false);
  pullDevices(false).then(n=>{if(n)render();}).catch(e=>syncLog('משיכת מכשירים: '+(e.message||e))).finally(()=>autoSync());
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){contacts=(await DB.kget('contacts'))||contacts;await maintenance();await pullInbox();await render();checkUpdate(false);pullDevices(false).then(n=>{if(n)render();}).catch(e=>syncLog('משיכת מכשירים: '+(e.message||e))).finally(()=>autoSync());}else{flushPush();}});
})();
